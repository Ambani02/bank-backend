steps:
  - name: "gcr.io/cloud-builders/docker"
    args: [
      "build",
      "-t", "us-central1-docker.pkg.dev/gcp-class-17/backend/backend-image",
      "."
    ]

  - name: "gcr.io/cloud-builders/docker"
    args: [
      "push",
      "us-central1-docker.pkg.dev/gcp-class-17/backend/backend-image"
    ]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      [
        "gcloud", "run", "deploy", "bank-backend",
        "--image", "us-central1-docker.pkg.dev/gcp-class-17/backend/backend-image",
        "--region", "us-central1",
        "--allow-unauthenticated",
        "--port", "8080",
        "--set-env-vars", "PORT=8080"
      ]
